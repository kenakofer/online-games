services:
  - type: web
    name: games
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker, always. Games live in module-level dicts in this process, so
    # a second worker would put players in the same room into different
    # processes and they would not see each other.
    startCommand: gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 --bind 0.0.0.0:$PORT wsgi:application
    envVars:
      # 3.11 is what this has actually been run against.
      - key: PYTHON_VERSION
        value: "3.11.9"
      # The session cookie is the player's identity, and this key signs it.
      # Render generates one once and keeps it, so players stay logged in
      # across deploys. Never replace it casually.
      - key: SECRET_KEY
        generateValue: true
